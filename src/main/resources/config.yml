# Night Royale — match engine. The server stays up between games; when no game is open it's
# whitelisted (real server whitelist, ops always bypass it) rather than shut down.

scoreboard:
  region: EU
  discord: discord.gg/nightroyale

tab:
  header-image:
    enabled: true
    glyph: "\uE200"
    font: "nightroyale:main"

match:
  min-players: 2
  countdown-seconds: 300
  purge-seconds: 5
  recruitment-seconds: 100
  ending-seconds: 10 # how long the winner screen shows before shutdown
  empty-timeout-seconds: 600 # if the freshly-booted server sits empty this long, shut down

# Fallback match settings, used ONLY when the Discord bot hasn't dropped a match.yml.
# The bot overwrites these per game via the Pterodactyl file API before boot.
# grace-seconds is also settable per-match now: /nr match grace=<seconds> or
# /nr start's modifier stream (grace=<seconds>) — this is only the fallback default.
defaults:
  team-size: SOLO # SOLO | DUOS | TRIOS
  storm-minutes: 20 # minutes until the storm fully closes (used in Phase 2)
  purge-cap: 60 # max players
  grace-seconds: 100
  scenarios: []
  hosted-by: Crown

